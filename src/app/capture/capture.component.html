<section class="page narrow">
  <p class="eyebrow">NEUER FUND</p>
  <h1>Kennzeichen erfassen</h1>
  <p class="muted">
    Deine nächste Zahl ist <strong>{{ next() }}</strong
    >.
  </p>
  <form (ngSubmit)="submit()">
    <label class="big-label">
      Welche Zahl hast du gesehen?
      <input
        class="number-input"
        type="number"
        min="1"
        name="number"
        [(ngModel)]="number"
        [disabled]="saving()"
        required
        inputmode="numeric"
      />
    </label>
    <label>
      Notiz (optional)
      <textarea
        name="note"
        [(ngModel)]="note"
        rows="2"
        maxlength="500"
        [disabled]="saving()"
        placeholder="z. B. Parkplatz am Bahnhof"
      ></textarea>
      <small class="input-hint">{{ note.length }}/500</small>
    </label>
    <label class="location-toggle">
      <input
        type="checkbox"
        name="saveLocation"
        [(ngModel)]="saveLocation"
        (ngModelChange)="locationPreferenceChanged()"
        [disabled]="saving()"
      />
      Standort speichern
    </label>
    <div class="location-status" role="status">{{ locationStatus() }}</div>
    <button
      class="primary full"
      type="submit"
      [disabled]="saving() || !validNumber()"
      [attr.aria-busy]="saving()"
    >
      @if (saving()) {
        <span class="loading-spinner" aria-label="Speichern läuft"></span>
      }
      {{ saving() ? 'Wird gespeichert…' : buttonLabel() }}
    </button>
  </form>
  @if (saveError()) {
    <p class="error" role="alert">{{ saveError() }}</p>
  }
  @if (saveMessage()) {
    <div class="result-card good">
      <h2>{{ saveMessage() }}</h2>
    </div>
  }
  @if (result(); as found) {
    <div class="result-card">
      <h2>{{ message(found) }}</h2>
      <p>{{ description(found) }}</p>
    </div>
  }
</section>
