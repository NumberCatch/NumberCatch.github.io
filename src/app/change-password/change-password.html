<section class="page narrow">
  <h1>Passwort ändern</h1>
  @if (saved()) {
  <p class="success">Dein Passwort wurde geändert.</p>
  <a routerLink="/profile">Zum Profil</a>
  } @else {
  <form (ngSubmit)="submit()">
    @if (!auth.passwordRecovery()) {
    <label>
      Bisheriges Passwort
      <input
        type="password"
        name="currentPassword"
        [(ngModel)]="currentPassword"
        required
        autocomplete="current-password"
      />
    </label>
    }
    <label>
      Neues Passwort
      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        required
        minlength="8"
        autocomplete="new-password"
      />
    </label>
    <label>
      Neues Passwort bestätigen
      <input
        type="password"
        name="confirmation"
        [(ngModel)]="confirmation"
        required
        minlength="8"
        autocomplete="new-password"
      />
    </label>
    <button class="primary full" type="submit" [disabled]="busy()">Passwort speichern</button>
  </form>
  @if (error()) {
  <p class="error">{{ error() }}</p>
  }
  <a routerLink="/profile">Zurück zum Profil</a>
  }
</section>
