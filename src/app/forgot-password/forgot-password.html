<section class="page narrow">
  <h1>Passwort vergessen?</h1>
  <p class="muted">Wir schicken dir einen Link zum Zurücksetzen.</p>
  @if (sent()) {
  <p class="success">Falls ein Konto für diese E-Mail existiert, ist der Link unterwegs.</p>
  } @else {
  <form (ngSubmit)="submit()">
    <label>
      E-Mail
      <input type="email" name="email" [(ngModel)]="email" required autocomplete="email" />
    </label>
    <button class="primary full" type="submit" [disabled]="busy()">Link anfordern</button>
  </form>
  } @if (error()) {
  <p class="error">{{ error() }}</p>
  }
  <a routerLink="/login">Zurück zum Login</a>
</section>
